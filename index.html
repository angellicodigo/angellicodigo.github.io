<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Angel Li - Photography</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/main.min.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.min.css" /></noscript>
    <link rel="stylesheet" href="assets/css/custom.min.css" />
    <link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="is-preload">

    <!-- Wrapper -->
    <div id="wrapper">

        <!-- Header -->
        <header id="header">
            <h1><a href="index.html">Angel Li</a></h1>
            <div class="search-box">
                <i class="fa fa-search search-icon" aria-hidden="true"></i>
                <input type="text" id="photo-search" placeholder="Search photos..." aria-label="Search photos" autocomplete="off" />
            </div>
        </header>

        <!-- Main -->
        <div id="main">
            <article class="thumb" data-photo-id="photo-1">
                <a href="images/fulls/photo-1-edited.jpg" class="image">
                    <img src="images/thumbs/photo-1.jpg" alt="Misty Alpine Forest" loading="lazy" />
                </a>
                <h2>Misty Alpine Forest</h2>
                <p>October 2026</p>
            </article>

            <article class="thumb" data-photo-id="photo-2">
                <a href="images/fulls/photo-2-edited.jpg" class="image">
                    <img src="images/thumbs/photo-2.jpg" alt="Minimalist Concrete Facade" loading="lazy" />
                </a>
                <h2>Minimalist Concrete Facade</h2>
                <p>September 2026</p>
            </article>

            <article class="thumb" data-photo-id="photo-3">
                <a href="images/fulls/photo-3-edited.jpg" class="image">
                    <img src="images/thumbs/photo-3.jpg" alt="Golden Hour Coastline" loading="lazy" />
                </a>
                <h2>Golden Hour Coastline</h2>
                <p>August 2026</p>
            </article>

            <article class="thumb" data-photo-id="photo-4">
                <a href="images/fulls/photo-4-edited.jpg" class="image">
                    <img src="images/thumbs/photo-4.jpg" alt="Monochrome Studio Portrait" loading="lazy" />
                </a>
                <h2>Monochrome Studio Portrait</h2>
                <p>July 2026</p>
            </article>

            <article class="thumb" data-photo-id="photo-5">
                <a href="images/fulls/photo-5-edited.jpg" class="image">
                    <img src="images/thumbs/photo-5.jpg" alt="Midnight Tokyo Alley" loading="lazy" />
                </a>
                <h2>Midnight Tokyo Alley</h2>
                <p>June 2026</p>
            </article>

            <article class="thumb" data-photo-id="photo-6">
                <a href="images/fulls/photo-6-edited.jpg" class="image">
                    <img src="images/thumbs/photo-6.jpg" alt="Desert Dune Geometry" loading="lazy" />
                </a>
                <h2>Desert Dune Geometry</h2>
                <p>May 2026</p>
            </article>

            <div id="empty-state" class="empty-state" style="display: none;">No photos match your query</div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="assets/js/main.js" defer></script>

</body>
</html>
