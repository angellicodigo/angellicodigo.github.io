<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Angel Li</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/main.min.css" />
    <noscript><link rel="stylesheet" href="assets/css/noscript.min.css" /></noscript>
    <link rel="stylesheet" href="assets/css/custom.min.css" />
    <link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,300italic,400,400italic">
</head>
<body class="is-preload">

    <!-- Wrapper -->
    <div id="wrapper">

        <!-- Header -->
        <header id="header">
            <h1>Angel Li</h1>
            <div class="search-box">
                <i class="fa fa-search search-icon" aria-hidden="true"></i>
                <input type="text" id="photo-search" placeholder="Search photos..." aria-label="Search photos" autocomplete="off" />
            </div>
        </header>

        <!-- Main (populated dynamically from data/photos.json) -->
        <div id="main">
            <div id="empty-state" class="empty-state" style="display: none;">No photos match your query</div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="assets/js/main.js" defer></script>

</body>
</html>
